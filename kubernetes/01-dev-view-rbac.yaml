# Grants the bedrock-dev-view IAM user read-only access cluster-wide.
# The IAM user is mapped to the "bedrock-viewers" group via an EKS access entry.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bedrock-dev-view-binding
subjects:
  - kind: Group
    name: bedrock-viewers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
